<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }}</title>
  <style>
      body {
          font-family: Arial, sans-serif;
          margin: 40px;
          background-color: #f4f4f4;
      }

      .container {
          margin: auto;
          max-width: 600px;
          background: white;
          padding: 20px;
          border-radius: 10px;
          box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      h2 {
          color: #333;
          margin-top: 0;
      }
      pre {
          background: #eee;
          padding: 10px;
          border-radius: 5px;
          overflow-x: auto;
      }

      table {
          font-family: arial, sans-serif;
          border-collapse: collapse;
          width: 100%;
      }

      td, th {
          border: 1px solid #eee;
          text-align: left;
          padding: 8px;
      }

      .rfc-link {
          font-size: .8em;
          margin-bottom: 0;
      }
  </style>
</head>
<body>
<div class="container">
    <h2>{{ .Name }}</h2>

    <table>
        <tr>
            <td>Title</td>
            <td>{{ .Title }}</td>
        </tr>
        <tr>
            <td>Recommended Status Codes</td>
            <td>{{ .RecommendedStatusCodes }}</td>
        </tr>
    </table>

    {{ .Description }}

    <br>

    <p class="rfc-link">
        <a href="https://www.rfc-editor.org/rfc/rfc9457.html" target="_blank">
            RFC 9457 - Problem Details for HTTP APIs
        </a>
    </p>
  </div>
</body>
</html>
